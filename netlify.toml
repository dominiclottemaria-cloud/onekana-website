# PROJECT ONEKANA — Netlify configuration

[build]
  # Static site — no build step, publish the project root
  publish = "."
  command = ""

# Long-term caching for images (they rarely change)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS must always revalidate with the server on each deploy — a blind
# max-age here caused stale cached styles to be paired with fresh HTML
# after a deploy (e.g. hero text rendering behind the hero image because
# the visitor's browser was still using yesterday's cached stylesheet).
# no-cache still lets the browser use a 304 to skip re-downloading when
# the file truly hasn't changed, so this doesn't hurt load times.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"
