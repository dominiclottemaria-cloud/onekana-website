# PROJECT ONEKANA — Netlify configuration

[build]
  # Static site — no build step, publish the project root
  publish = "."
  command = ""

# Long-term caching for images (they rarely change)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS/JS are referenced with a ?v= version query string in every HTML file
# (e.g. css/styles.css?v=3). That query string IS the cache key, so it is
# safe — and fastest — to cache these aggressively: a browser that already
# has ?v=3 cached keeps using it instantly, and any browser still holding
# an old ?v=2 (or no query string) is forced to fetch a brand-new URL the
# moment the HTML changes, regardless of how long the old response was
# cached for. Bump the ?v= number in the HTML files whenever CSS/JS changes.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
